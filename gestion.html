<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Calidad UAM</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --azul:#0c356a;
  --celeste:#60c5e8;
  --gris:#687787;
  --fondo:#f4f7f9;
  --blanco:#ffffff;
  --borde:#dfe7ec;
}

html{
  width:100%;
  overflow-x:hidden;
}

body{
  width:100%;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--fondo);
  color:#1d2a36;

  /* ÚNICO SCROLL VERTICAL */
  overflow-x:hidden;
  overflow-y:auto;
}

/* =====================================================
   HEADER
===================================================== */

header{
  width:100%;
  background:var(--blanco);
  border-bottom:1px solid var(--borde);
}

.topbar{
  width:100%;
  margin:0;
  padding:14px 22px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.marca{
  display:flex;
  gap:12px;
  align-items:center;
}

.barra{
  width:8px;
  height:54px;
  border-radius:8px;
  background:var(--celeste);
}

.marca h1{
  margin:0;
  color:var(--azul);
  font-size:23px;
  font-weight:600;
  letter-spacing:-.3px;
}

.marca p{
  margin:4px 0 0;
  color:var(--gris);
  font-size:12px;
}

/* =====================================================
   MENÚ
===================================================== */

.nav{
  width:100%;
  background:var(--azul);
}

.tabs{
  width:100%;
  margin:0;
  padding:0 10px;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
}

.tab{
  appearance:none;
  border:0;
  background:transparent;
  color:white;
  padding:14px 20px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  border-bottom:4px solid transparent;
  white-space:nowrap;
}

.tab:hover{
  background:rgba(255,255,255,.07);
}

.tab.activo{
  border-bottom-color:var(--celeste);
  background:rgba(255,255,255,.05);
}

/* =====================================================
   CONTENIDO
===================================================== */

main{
  width:100%;
  margin:0;
  padding:12px;
}

.aviso{
  width:100%;
  background:#eef7fb;
  border-left:4px solid var(--celeste);
  border-radius:8px;
  padding:9px 12px;
  margin-bottom:10px;
  color:#31566e;
  font-size:11.5px;
  line-height:1.4;
}

.contenedor{
  width:100%;
  max-width:100%;
  background:white;
  border:1px solid var(--borde);
  border-radius:10px;

  /*
  IMPORTANTE:
  No tiene scroll vertical propio.
  */
  overflow:visible;

  box-shadow:0 2px 9px rgba(20,50,80,.04);
}

/* =====================================================
   IFRAME
===================================================== */

iframe{
  display:block;
  width:100%;
  max-width:100%;

  border:0;

  margin:0;
  padding:0;

  background:white;

  /*
  El iframe NO hace scroll.
  Su altura se adapta con JavaScript.
  */
  overflow:hidden;

  min-height:900px;
}

/* =====================================================
   NOTEBOOK
===================================================== */

@media(max-width:1450px){

  .topbar{
    padding:11px 14px;
  }

  .marca h1{
    font-size:21px;
  }

  .barra{
    height:48px;
  }

  .tab{
    padding:12px 15px;
    font-size:11px;
  }

  main{
    padding:8px;
  }

}

/* =====================================================
   CELULAR
===================================================== */

@media(max-width:700px){

  .topbar{
    padding:12px;
  }

  .marca h1{
    font-size:19px;
  }

  .marca p{
    font-size:11px;
  }

  .barra{
    width:6px;
    height:44px;
  }

  .tabs{
    padding:0;
  }

  .tab{
    padding:12px 14px;
    font-size:11px;
  }

  main{
    padding:5px;
  }

  .contenedor{
    border-radius:7px;
  }

}

</style>
</head>

<body>

<header>

  <div class="topbar">

    <div class="marca">

      <div class="barra"></div>

      <div>
        <h1>DUPLICAR NORTE UAM</h1>
        <p>Gestión de Inputs · Calidad</p>
      </div>

    </div>

  </div>

  <div class="nav">

    <div class="tabs">

      <button
        id="tabDocumentacion"
        class="tab activo"
        onclick="abrirModulo('documentacion',this)">
        📄 ADMINISTRACIÓN DE DOCUMENTACIÓN
      </button>

      <button
        id="tabBlister"
        class="tab"
        onclick="abrirModulo('blister',this)">
        ⚠️ OBSERVACIONES BLISTER
      </button>

      <button
        id="tabCapacitaciones"
        class="tab"
        onclick="abrirModulo('capacitaciones',this)">
        🎓 CAPACITACIONES
      </button>

      <button
        id="tabMatriz"
        class="tab"
        onclick="abrirModulo('matriz',this)">
        📊 MATRIZ
      </button>

      <button
        id="tabPiping"
        class="tab"
        onclick="abrirModulo('piping',this)">
        🔧 PIPING
      </button>

      <button
        id="tabMaestro"
        class="tab"
        onclick="abrirModulo('maestro',this)">
        📋 LISTADO BASE
      </button>

    </div>

  </div>

</header>

<main>

  <div class="aviso">
    Ingresá una sola vez desde Administración de Documentación.
    Después podés cambiar de pestaña para cargar Blister,
    Capacitaciones, Matriz, Piping o modificar el Listado Base.
  </div>

  <div class="contenedor">

    <iframe
      id="visor"
      src="admin.html"
      title="Gestión de Calidad"
      scrolling="no">
    </iframe>

  </div>

</main>

<script>

/* =====================================================
   RUTAS
===================================================== */

const rutas = {

  documentacion:"admin.html",

  blister:"blister-admin.html",

  capacitaciones:"capacitaciones-admin.html",

  matriz:"matriz-admin.html",

  piping:"piping-admin.html",

  maestro:"maestro.html"

};

let moduloActual = "documentacion";


/* =====================================================
   CAMBIAR PESTAÑA
===================================================== */

function abrirModulo(modulo,boton){

  if(!rutas[modulo]){
    return;
  }

  document
    .querySelectorAll(".tab")
    .forEach(x=>{
      x.classList.remove("activo");
    });

  boton.classList.add("activo");

  moduloActual = modulo;

  const visor =
    document.getElementById("visor");

  visor.src =
    rutas[modulo] +
    "?v=" +
    Date.now();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   ELIMINAR SCROLL VERTICAL INTERNO
===================================================== */

function prepararIframe(iframe){

  try{

    const doc =
      iframe.contentWindow.document;

    if(!doc){
      return;
    }

    let estilo =
      doc.getElementById(
        "gestion-un-scroll"
      );

    if(estilo){
      estilo.remove();
    }

    estilo =
      doc.createElement("style");

    estilo.id =
      "gestion-un-scroll";

    estilo.innerHTML = `

      /* =================================================
         SOLO SCROLL EN GESTION.HTML
      ================================================= */

      html,
      body{

        width:100% !important;

        max-width:100% !important;

        height:auto !important;

        min-height:0 !important;

        overflow-y:visible !important;

        overflow-x:hidden !important;

        margin:0 !important;

      }


      /* =================================================
         QUITAR ALTURAS FIJAS Y SCROLLS INTERNOS
      ================================================= */

      main,
      section,
      .container,
      .contenedor,
      .content,
      .contenido,
      .wrapper,
      .page,
      .panel,
      .card{

        max-height:none !important;

        height:auto;

        overflow-y:visible !important;

      }


      /* =================================================
         CONTENEDORES DE TABLAS

         NO scroll vertical.
         Horizontal solamente si realmente fuera necesario.
      ================================================= */

      .table-container,
      .table-wrapper,
      .table-responsive,
      .tabla-container,
      .tabla-wrapper,
      .tabla-scroll,
      .table-scroll{

        width:100% !important;

        max-width:100% !important;

        height:auto !important;

        max-height:none !important;

        overflow-y:visible !important;

        overflow-x:auto !important;

      }


      /* =================================================
         TABLAS
      ================================================= */

      table{

        width:100% !important;

        max-width:100% !important;

        table-layout:fixed !important;

        border-collapse:collapse;

      }


      th,
      td{

        padding:9px 8px !important;

        font-size:12px !important;

        line-height:1.25 !important;

        vertical-align:middle !important;

        white-space:normal !important;

        overflow-wrap:anywhere !important;

      }


      th{

        font-size:11px !important;

      }


      /* =================================================
         INPUTS
      ================================================= */

      input,
      select,
      textarea{

        width:100%;

        max-width:100% !important;

        min-width:0 !important;

        font-size:12px !important;

      }


      input,
      select{

        min-height:38px !important;

        padding:7px 9px !important;

      }


      textarea{

        padding:7px 9px !important;

      }


      /* =================================================
         NOTEBOOK
      ================================================= */

      @media(max-width:1450px){

        th,
        td{

          padding:7px 6px !important;

          font-size:11px !important;

        }

        th{

          font-size:10px !important;

        }

        input,
        select,
        textarea{

          font-size:11px !important;

        }

        input,
        select{

          min-height:34px !important;

        }

      }

    `;

    doc.head.appendChild(estilo);

  }
  catch(error){

    console.log(
      "No se pudo preparar iframe",
      error
    );

  }

}


/* =====================================================
   AJUSTAR ALTURA
===================================================== */

function ajustarAlturaIframe(iframe){

  try{

    const doc =
      iframe.contentWindow.document;

    const body =
      doc.body;

    const html =
      doc.documentElement;

    const alto =
      Math.max(

        body.scrollHeight,

        body.offsetHeight,

        html.scrollHeight,

        html.offsetHeight,

        900

      );

    iframe.style.height =
      alto + "px";

  }
  catch(error){

    iframe.style.height =
      "900px";

  }

}


/* =====================================================
   IFRAME
===================================================== */

const visor =
  document.getElementById("visor");


visor.addEventListener(
  "load",
  function(){

    const iframe = this;

    prepararIframe(iframe);

    /* Primer ajuste */

    setTimeout(()=>{
      ajustarAlturaIframe(iframe);
    },100);


    /* Segundo ajuste cuando terminaron de aparecer datos */

    setTimeout(()=>{
      ajustarAlturaIframe(iframe);
    },500);


    setTimeout(()=>{
      ajustarAlturaIframe(iframe);
    },1200);


    /*
    Observa modificaciones dentro de admin.html:
    filtros, búsqueda, filas, desplegables, etc.
    */

    try{

      const doc =
        iframe.contentWindow.document;

      const observer =
        new MutationObserver(()=>{

          ajustarAlturaIframe(
            iframe
          );

      });

      observer.observe(
        doc.body,
        {
          childList:true,
          subtree:true,
          attributes:true
        }
      );


      /*
      También observa cambios de tamaño.
      */

      if(
        window.ResizeObserver
      ){

        const resizeObserver =
          new ResizeObserver(()=>{

            ajustarAlturaIframe(
              iframe
            );

          });

        resizeObserver.observe(
          doc.body
        );

      }

    }
    catch(error){

      console.log(error);

    }

  }
);


/* =====================================================
   REDIMENSIONAR VENTANA
===================================================== */

window.addEventListener(
  "resize",
  function(){

    ajustarAlturaIframe(
      document.getElementById("visor")
    );

  }
);

</script>

</body>
</html>
