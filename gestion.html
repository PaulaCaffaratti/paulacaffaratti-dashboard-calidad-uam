
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Calidad UAM</title>

<style>

/* GENERAL */

* {
  box-sizing: border-box;
}

:root {
  --azul: #0c356a;
  --celeste: #60c5e8;
  --gris: #687787;
  --fondo: #f4f7f9;
  --blanco: #ffffff;
  --borde: #dfe7ec;
}

html {
  width: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body {
  width: 100%;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--fondo);
  color: #1d2a36;
  overflow-x: hidden;
  overflow-y: auto;
}

/* ENCABEZADO */

header {
  width: 100%;
  background: var(--blanco);
  border-bottom: 1px solid var(--borde);
}

.topbar {
  width: 100%;
  padding: 14px 22px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.marca {
  display: flex;
  gap: 12px;
  align-items: center;
}

.barra {
  width: 8px;
  height: 54px;
  border-radius: 8px;
  background: var(--celeste);
}

.marca h1 {
  margin: 0;
  color: var(--azul);
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -.3px;
}

.marca p {
  margin: 4px 0 0;
  color: var(--gris);
  font-size: 12px;
}

/* NAVEGACIÓN */

.nav {
  width: 100%;
  background: var(--azul);
}

.tabs {
  width: 100%;
  margin: 0;
  padding: 0 10px;
  display: flex;
  align-items: center;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
}

.tab {
  appearance: none;
  border: 0;
  background: transparent;
  color: white;
  padding: 14px 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 4px solid transparent;
  white-space: nowrap;
  transition: background .2s;
}

.tab:hover {
  background: rgba(255,255,255,.07);
}

.tab.activo {
  border-bottom-color: var(--celeste);
  background: rgba(255,255,255,.05);
}

/* CONTENIDO */

main {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 12px;
  overflow: visible;
}

.aviso {
  width: 100%;
  background: #eef7fb;
  border-left: 4px solid var(--celeste);
  border-radius: 8px;
  padding: 9px 12px;
  margin-bottom: 10px;
  color: #31566e;
  font-size: 11.5px;
  line-height: 1.4;
}

.contenedor {
  width: 100%;
  max-width: 100%;
  background: white;
  border: 1px solid var(--borde);
  border-radius: 10px;
  overflow: visible;
  box-shadow: 0 2px 9px rgba(20,50,80,.04);
}

/* IFRAME */

#visor {
  display: block;
  width: 100%;
  max-width: 100%;
  min-height: 900px;
  margin: 0;
  padding: 0;
  border: 0;
  background: white;
  overflow: hidden;
}

/* NOTEBOOK */

@media(max-width:1450px) {

  .topbar {
    padding: 11px 14px;
  }

  .marca h1 {
    font-size: 21px;
  }

  .barra {
    height: 48px;
  }

  .tab {
    padding: 12px 15px;
    font-size: 11px;
  }

  main {
    padding: 8px;
  }

}

/* CELULAR */

@media(max-width:700px) {

  .topbar {
    padding: 12px;
  }

  .marca h1 {
    font-size: 19px;
  }

  .marca p {
    font-size: 11px;
  }

  .barra {
    width: 6px;
    height: 44px;
  }

  .tabs {
    padding: 0;
  }

  .tab {
    padding: 12px 14px;
    font-size: 11px;
  }

  main {
    padding: 5px;
  }

  .contenedor {
    border-radius: 7px;
  }

}

</style>
</head>

<body>

<header>

  <div class="topbar">

    <div class="marca">

      <div class="barra"></div>

      <div>
        <h1>DUPLICAR NORTE UAM</h1>
        <p>Gestión de Inputs · Calidad</p>
      </div>

    </div>

  </div>

  <!-- PESTAÑAS -->

  <div class="nav">

    <div class="tabs">

      <button
        id="tabDocumentacion"
        class="tab activo"
        onclick="abrirModulo('documentacion',this)"
      >
        📄 ADMINISTRACIÓN DE DOCUMENTACIÓN
      </button>

      <button
        id="tabBlister"
        class="tab"
        onclick="abrirModulo('blister',this)"
      >
        ⚠️ OBSERVACIONES BLISTER
      </button>

      <button
        id="tabCapacitaciones"
        class="tab"
        onclick="abrirModulo('capacitaciones',this)"
      >
        🎓 CAPACITACIONES
      </button>

      <button
        id="tabMatriz"
        class="tab"
        onclick="abrirModulo('matriz',this)"
      >
        📊 MATRIZ
      </button>

      <button
        id="tabPiping"
        class="tab"
        onclick="abrirModulo('piping',this)"
      >
        🔧 PIPING
      </button>

      <!-- NUEVA PESTAÑA HALLAZGOS -->

      <button
        id="tabHallazgos"
        class="tab"
        onclick="abrirModulo('hallazgos',this)"
      >
        🔎 HALLAZGOS
      </button>

      <button
        id="tabMaestro"
        class="tab"
        onclick="abrirModulo('maestro',this)"
      >
        📋 LISTADO BASE
      </button>

      <!-- ÍNDICE DE PRODUCCIÓN -->

      <button
        id="tabIndiceProduccion"
        class="tab"
        onclick="abrirModulo('indiceProduccion',this)"
      >
        📈 ÍNDICE DE PRODUCCIÓN
      </button>
      
    </div>

  </div>

</header>

<main>

  <div class="aviso">
    Ingresá una sola vez desde Administración de Documentación.
    Después podés cambiar de pestaña para cargar Blister,
    Capacitaciones, Matriz, Piping, Hallazgos o modificar
    el Listado Base.
  </div>

  <div class="contenedor">

    <iframe
      id="visor"
      src="admin.html"
      title="Gestión de Calidad"
      scrolling="no"
    ></iframe>

  </div>

</main>

<script>

/* RUTAS DE LOS MÓDULOS */

const rutas = {

  documentacion: "admin.html",

  blister: "blister-admin.html",

  capacitaciones: "capacitaciones-admin.html",

  matriz: "matriz-admin.html",


  piping: "piping-admin.html",

  hallazgos: "hallazgos-admin.html",

  maestro: "maestro.html",

  indiceProduccion: "indice-produccion-admin.html"

};


let moduloActual = "documentacion";

/* CAMBIAR PESTAÑA */

function abrirModulo(modulo, boton) {

  if (!rutas[modulo]) {
    return;
  }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.remove("activo");
  });

  boton.classList.add("activo");

  moduloActual = modulo;

  const visor = document.getElementById("visor");

  visor.style.height = "900px";

  visor.src = rutas[modulo] + "?v=" + Date.now();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

/* ELIMINAR SCROLL VERTICAL INTERNO */

function quitarScrollInterno(iframe) {

  try {

    const win = iframe.contentWindow;
    const doc = win.document;

    if (!doc || !doc.body) return;

    [doc.documentElement, doc.body].forEach(el => {

      el.style.setProperty(
        "height", "auto", "important"
      );

      el.style.setProperty(
        "max-height", "none", "important"
      );

      el.style.setProperty(
        "overflow-y", "visible", "important"
      );

    });

    doc.querySelectorAll("*").forEach(elemento => {

      if (
        elemento === doc.body ||
        elemento === doc.documentElement
      ) return;

      const estilo = win.getComputedStyle(elemento);

      const overflowY = estilo.overflowY;

      const tieneScroll =
        overflowY === "auto" ||
        overflowY === "scroll" ||
        overflowY === "overlay";

      if (
        tieneScroll &&
        elemento.scrollHeight > elemento.clientHeight + 1
      ) {

        elemento.style.setProperty(
          "overflow-y", "visible", "important"
        );

        elemento.style.setProperty(
          "max-height", "none", "important"
        );

        elemento.style.setProperty(
          "height", "auto", "important"
        );

      }

    });

  } catch(error) {

    console.log(
      "Error eliminando scroll interno:",
      error
    );

  }

}

/* AJUSTE VISUAL DE LOS MÓDULOS */

function ajustarVisual(iframe) {

  try {

    const doc = iframe.contentWindow.document;

    if (!doc || !doc.head) return;

    let estilo = doc.getElementById("gestion-ajuste-pc");

    if (estilo) estilo.remove();

    estilo = doc.createElement("style");

    estilo.id = "gestion-ajuste-pc";

    estilo.textContent = `

      html, body {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow-y: visible !important;
        overflow-x: hidden !important;
      }

      main,
      section,
      .container,
      .contenedor,
      .content,
      .contenido,
      .wrapper,
      .page,
      .panel,
      .card {
        max-width: 100% !important;
        max-height: none !important;
        overflow-y: visible !important;
      }

      .table-container,
      .table-wrapper,
      .table-responsive,
      .tabla-container,
      .tabla-wrapper,
      .tabla-scroll,
      .table-scroll,
      .scroll-container,
      .scroll-wrapper {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: none !important;
        overflow-y: visible !important;
      }

      table {
        width: 100% !important;
        max-width: 100% !important;
        table-layout: fixed !important;
        border-collapse: collapse;
      }

      th, td {
        padding: 9px 8px !important;
        font-size: 12px !important;
        line-height: 1.25 !important;
        vertical-align: middle !important;
        white-space: normal !important;
        overflow-wrap: anywhere !important;
      }

      th {
        font-size: 11px !important;
      }

      input, select, textarea {
        max-width: 100% !important;
        min-width: 0 !important;
        font-size: 12px !important;
      }

      input, select {
        min-height: 38px !important;
        padding: 7px 9px !important;
      }

      textarea {
        padding: 7px 9px !important;
      }

      @media(max-width:1450px) {

        th, td {
          padding: 7px 6px !important;
          font-size: 11px !important;
        }

        th {
          font-size: 10px !important;
        }

        input, select, textarea {
          font-size: 11px !important;
        }

        input, select {
          min-height: 34px !important;
          padding: 5px 7px !important;
        }

      }

    `;

    doc.head.appendChild(estilo);

  } catch(error) {

    console.log("Error ajustando visual:", error);

  }

}

/* CALCULAR ALTURA DEL IFRAME */

function ajustarAltura(iframe) {

  try {

    const win = iframe.contentWindow;
    const doc = win.document;

    if (!doc || !doc.body) return;

    quitarScrollInterno(iframe);

    const body = doc.body;
    const html = doc.documentElement;

    let maxBottom = 0;

    doc.body.querySelectorAll("*").forEach(elemento => {

      const estilo = win.getComputedStyle(elemento);

      if (estilo.display === "none") return;

      const rect = elemento.getBoundingClientRect();

      if (Number.isFinite(rect.bottom)) {

        maxBottom = Math.max(
          maxBottom,
          rect.bottom
        );

      }

    });

    const alto = Math.max(
      body.scrollHeight,
      body.offsetHeight,
      html.scrollHeight,
      html.offsetHeight,
      maxBottom,
      900
    );

    iframe.style.height = Math.ceil(alto + 60) + "px";

  } catch(error) {

    console.log("Error ajustando altura:", error);

  }

}

/* PROCESAR IFRAME */

function procesarIframe(iframe) {

  ajustarVisual(iframe);
  quitarScrollInterno(iframe);
  ajustarAltura(iframe);

}

/* CARGA DE MÓDULOS */

const visor = document.getElementById("visor");

visor.setAttribute("scrolling", "no");

let observerActual = null;
let resizeObserverActual = null;

visor.addEventListener("load", function() {

  const iframe = this;

  if (observerActual) {
    observerActual.disconnect();
    observerActual = null;
  }

  if (resizeObserverActual) {
    resizeObserverActual.disconnect();
    resizeObserverActual = null;
  }

  procesarIframe(iframe);

  [
    100,
    300,
    700,
    1200,
    2000,
    3500
  ].forEach(tiempo => {

    setTimeout(() => {

      if (iframe === visor) {
        procesarIframe(iframe);
      }

    }, tiempo);

  });

  try {

    const doc = iframe.contentWindow.document;

    let pendiente = false;

    observerActual = new MutationObserver(() => {

      if (pendiente) return;

      pendiente = true;

      requestAnimationFrame(() => {

        ajustarAltura(iframe);

        pendiente = false;

      });

    });

    observerActual.observe(doc.body, {
      childList: true,
      subtree: true
    });

    if (window.ResizeObserver) {

      resizeObserverActual = new ResizeObserver(() => {
        ajustarAltura(iframe);
      });

      resizeObserverActual.observe(doc.body);

    }

  } catch(error) {

    console.log(
      "Error creando observadores:",
      error
    );

  }

});

/* CAMBIO DE TAMAÑO DE PANTALLA */

let resizeTimer;

window.addEventListener("resize", function() {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {

    procesarIframe(
      document.getElementById("visor")
    );

  }, 150);

});

</script>

</body>
</html>
